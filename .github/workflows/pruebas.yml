name: pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar pdftotext (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Instalar pdftotext (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Instalar pytest
        run: python -m pip install "pytest<9"
      - name: Pruebas
        run: python -m pytest -q tests/
      - name: Nada personal en lo publicado
        run: python -I herramientas/revisar_publicacion.py --todo
      - name: Ayuda de cada herramienta
        run: for h in cfdi_mx fiscal_mx autofactura documentos tipo_cambio_banxico revisar_publicacion; do python -I herramientas/$h.py --help > /dev/null; done

  python-3-9:
    # setup-python ya no publica 3.9 para el Ubuntu más reciente: se prueba en la imagen oficial de Python.
    runs-on: ubuntu-latest
    container: python:3.9-slim-bookworm
    steps:
      - uses: actions/checkout@v5
      - name: Instalar pdftotext
        run: apt-get update && apt-get install -y poppler-utils
      - name: Instalar pytest (la 9 ya no soporta Python 3.9)
        run: python -m pip install "pytest<9"
      - name: Pruebas
        run: python -m pytest -q tests/
